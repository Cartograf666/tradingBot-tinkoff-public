name: Market study daily completeness
on:
  workflow_dispatch:
  schedule:
    - cron: '25 16 * * 1-5'
    - cron: '37 6-16 * * 1-5'
  workflow_run:
    workflows: ['Market study (public compute, private data)']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: market-study-report
  cancel-in-progress: false
jobs:
  report:
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      !startsWith(github.event.workflow_run.display_title, 'Market study / report /')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MARKET_STUDY_DATA_REPOSITORY: ${{ vars.MARKET_STUDY_DATA_REPOSITORY }}
      STUDY_HOST_PRIVATE: 'false'
      STUDY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '25.4.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p tsconfig.study.json
      - name: Recover uploaded receipts and report all incomplete days
        env:
          MARKET_STUDY_STORAGE_TOKEN: ${{ secrets.MARKET_STUDY_STORAGE_TOKEN }}
          GH_TOKEN: ${{ secrets.MARKET_STUDY_STORAGE_TOKEN }}
          STUDY_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          node .study-dist/src/report/study-host.js report
          node .study-dist/src/report/market-study.js report --repo "$MARKET_STUDY_DATA_REPOSITORY"
