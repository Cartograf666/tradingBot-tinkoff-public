name: Market study (public compute, private data)
run-name: Market study / ${{ github.event_name == 'schedule' && 'arm' || inputs.mode }} / ${{ github.event_name == 'schedule' && (github.event.schedule == '17,47 0 * * 1-5' || github.event.schedule == '17 1 * * 1-5' || github.event.schedule == '20,35 5 * * 1-5' || github.event.schedule == '50,55 5 * * 1-5' || github.event.schedule == '0,5,10,15 6 * * 1-5') && 'early' || github.event_name == 'schedule' && 'late' || inputs.block }}

on:
  schedule:
    # UTC: 03:17/03:47/04:17 and 08:17/08:47/09:17 Moscow.
    # Each preparation remains within the existing 350-minute job limit.
    - cron: '17,47 0 * * 1-5'
    - cron: '17 1 * * 1-5'
    - cron: '17,47 5 * * 1-5'
    - cron: '17 6 * * 1-5'
    # Start runners early; credential-free preparation waits for 08:50/13:50 MSK.
    - cron: '20,35 5 * * 1-5'
    - cron: '20,35 10 * * 1-5'
    - cron: '50,55 5 * * 1-5'
    - cron: '0,5,10,15 6 * * 1-5'
    - cron: '50,55 10 * * 1-5'
    - cron: '0,5,10,15 11 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Операция: check проверяет код без секретов'
        type: choice
        required: true
        default: check
        options: [check, preflight, smoke, observe, continuous-pilot, campaign, arm, freeze, status, report]
      block:
        description: 'Блок полной сессии (campaign или arm)'
        type: choice
        required: true
        default: early
        options: [early, late]

permissions:
  contents: read
  actions: read

concurrency:
  group: market-study-${{ github.event_name == 'schedule' && (github.event.schedule == '17,47 0 * * 1-5' || github.event.schedule == '17 1 * * 1-5' || github.event.schedule == '20,35 5 * * 1-5' || github.event.schedule == '50,55 5 * * 1-5' || github.event.schedule == '0,5,10,15 6 * * 1-5') && 'early' || github.event_name == 'schedule' && 'late' || (inputs.mode == 'campaign' || inputs.mode == 'arm') && inputs.block || inputs.mode }}
  cancel-in-progress: false

env:
  MARKET_STUDY_DATA_REPOSITORY: ${{ vars.MARKET_STUDY_DATA_REPOSITORY }}
  STUDY_HOST_PRIVATE: ${{ github.event.repository.private && 'true' || 'false' }}
  STUDY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  code-check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.4.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Explain result
        run: echo 'Code checks passed. This operation collects no market data and needs no credentials.'

  prepare:
    if: >-
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'arm')) &&
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.MARKET_STUDY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.4.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p tsconfig.study.json
      - name: Wait for today's block without broker or storage credentials
        env:
          STUDY_BLOCK: ${{ github.event_name == 'schedule' && (github.event.schedule == '17,47 0 * * 1-5' || github.event.schedule == '17 1 * * 1-5' || github.event.schedule == '20,35 5 * * 1-5' || github.event.schedule == '50,55 5 * * 1-5' || github.event.schedule == '0,5,10,15 6 * * 1-5') && 'early' || github.event_name == 'schedule' && 'late' || inputs.block }}
        run: node .study-dist/src/report/market-study.js prepare-block --block "$STUDY_BLOCK"

  campaign:
    concurrency:
      group: market-study-capture
      cancel-in-progress: false
    needs: prepare
    if: >-
      !cancelled() &&
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event_name == 'schedule' && vars.MARKET_STUDY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'campaign' || inputs.mode == 'arm') && vars.MARKET_STUDY_ENABLED == 'true')) &&
      ((github.event_name != 'schedule' && inputs.mode != 'arm') || needs.prepare.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.4.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p tsconfig.study.json
      - name: Verify private destination and capture the owned block
        shell: bash
        env:
          MARKET_STUDY_STORAGE_TOKEN: ${{ secrets.MARKET_STUDY_STORAGE_TOKEN }}
          GH_TOKEN: ${{ secrets.MARKET_STUDY_STORAGE_TOKEN }}
          TINKOFF_API_TOKEN_SANDBOX: ${{ secrets.TINKOFF_API_TOKEN_SANDBOX }}
          GRPC_DEFAULT_SSL_ROOTS_FILE_PATH: ${{ github.workspace }}/certs/russian-trusted-root-ca.pem
          MARKET_STUDY_ENABLED: ${{ vars.MARKET_STUDY_ENABLED }}
          STUDY_BLOCK: ${{ github.event_name == 'schedule' && (github.event.schedule == '17,47 0 * * 1-5' || github.event.schedule == '17 1 * * 1-5' || github.event.schedule == '20,35 5 * * 1-5' || github.event.schedule == '50,55 5 * * 1-5' || github.event.schedule == '0,5,10,15 6 * * 1-5') && 'early' || github.event_name == 'schedule' && 'late' || inputs.block }}
        run: |
          node .study-dist/src/report/study-host.js campaign
          node .study-dist/src/report/market-study.js run-block \
            --repo "$MARKET_STUDY_DATA_REPOSITORY" --block "$STUDY_BLOCK" \
            --workspace "$RUNNER_TEMP/market-study" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

  utility:
    concurrency:
      group: ${{ (inputs.mode == 'preflight' || inputs.mode == 'smoke' || inputs.mode == 'observe') && 'market-study-capture' || format('market-study-utility-{0}', inputs.mode) }}
      cancel-in-progress: false
    if: >-
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'preflight' || inputs.mode == 'smoke' || inputs.mode == 'observe' || inputs.mode == 'continuous-pilot' || inputs.mode == 'freeze' || inputs.mode == 'status' || inputs.mode == 'report')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.mode == 'observe' && 350 || 10 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.4.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p tsconfig.study.json
      - name: Verify sandbox access or run market smoke with private archive
        if: inputs.mode == 'preflight' || inputs.mode == 'smoke' || inputs.mode == 'observe' || inputs.mode == 'continuous-pilot'
        env:
          MARKET_STUDY_STORAGE_TOKEN: ${{ secrets.MARKET_STUDY_STORAGE_TOKEN }}
          GH_TOKEN: ${{ secrets.MARKET_STUDY_STORAGE_TOKEN }}
          TINKOFF_API_TOKEN_SANDBOX: ${{ secrets.TINKOFF_API_TOKEN_SANDBOX }}
          GRPC_DEFAULT_SSL_ROOTS_FILE_PATH: ${{ github.workspace }}/certs/russian-trusted-root-ca.pem
          STUDY_MODE: ${{ inputs.mode }}
        run: |
          node .study-dist/src/report/study-host.js "$STUDY_MODE"
          node .study-dist/src/report/market-study.js "$STUDY_MODE" \
            --workspace "$RUNNER_TEMP/market-study" --repo "$MARKET_STUDY_DATA_REPOSITORY"
      - name: Inspect private state or freeze the tested version
        if: inputs.mode == 'freeze' || inputs.mode == 'status' || inputs.mode == 'report'
        env:
          MARKET_STUDY_STORAGE_TOKEN: ${{ secrets.MARKET_STUDY_STORAGE_TOKEN }}
          GH_TOKEN: ${{ secrets.MARKET_STUDY_STORAGE_TOKEN }}
          STUDY_MODE: ${{ inputs.mode }}
          STUDY_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          node .study-dist/src/report/study-host.js "$STUDY_MODE"
          node .study-dist/src/report/market-study.js "$STUDY_MODE" --repo "$MARKET_STUDY_DATA_REPOSITORY"

      # Raw recordings AND derived reports are uploaded only by the private
      # release transport above. Do not add public Actions artifact uploads here.
