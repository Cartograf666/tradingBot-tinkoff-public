name: Market study checks

on:
  pull_request:
    paths:
      - '.github/workflows/*study*.yml'
      - 'src/research/**'
      - 'src/report/**'
      - 'src/report/replay-orderbook.ts'
      - 'src/report/market-study.ts'
      - 'src/report/*.test.ts'
      - 'src/report/study-host.ts'
      - 'src/core/tinkoff-client*'
      - 'certs/**'
      - 'src/domain/trading.ts'
      - 'package*.json'
      - 'tsconfig.study.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/*study*.yml'
      - 'src/research/**'
      - 'src/report/**'
      - 'src/report/replay-orderbook.ts'
      - 'src/report/market-study.ts'
      - 'src/report/*.test.ts'
      - 'src/report/study-host.ts'
      - 'src/core/tinkoff-client*'
      - 'certs/**'
      - 'src/domain/trading.ts'
      - 'package*.json'
      - 'tsconfig.study.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '25.4.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run study:test
